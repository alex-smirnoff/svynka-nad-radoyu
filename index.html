<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🐷 СВИНКА-АНТИКОРУПЦІОНЕР</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #060612;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Georgia', serif;
  }
  canvas {
    display: block;
    image-rendering: pixelated;
    cursor: default;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════════
//  CANVAS SETUP
// ═══════════════════════════════════════════════════════════════
const C = document.getElementById('c');
const ctx = C.getContext('2d');
const W = C.width  = 900;
const H = C.height = 560;
const RADA_H = 98;
const SKY_H  = H - RADA_H;

function fitCanvas() {
  const a = W / H, sw = window.innerWidth, sh = window.innerHeight;
  if (sw / sh > a) { C.style.height = sh + 'px'; C.style.width = (sh * a) + 'px'; }
  else             { C.style.width = sw + 'px'; C.style.height = (sw / a) + 'px'; }
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

// ═══════════════════════════════════════════════════════════════
//  CONSTANTS / PHYSICS
// ═══════════════════════════════════════════════════════════════
const GRAVITY        = 0.10;   // майже невагома
const JUMP_FORCE     = -9.0;   // перший стрибок
const JUMP2_FORCE    = -7.5;   // другий стрибок у повітрі
const GLIDE_REDUCE   = 0.28;   // ширяння при утриманні — майже зупиняє падіння
const TERMINAL_VY    = 4.2;    // крила тримають — не падає каменем
const WING_DRAG      = 0.988;  // повітряний опір
const WALK_SPEED     = 5.0;
const PIG_W = 72;
const PIG_H = 54;

const MAX_JUMP_UP   = 210;
const MAX_JUMP_DOWN = 160;
const MAX_H_GAP     = 260;

// ═══════════════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════════════
let gState = 'menu'; // menu | playing | gameover | victory
let score = 0, lives = 3, frame = 0;
let radaCrack = 0;            // 0-1000
let bossQueue = null, bossTimer = 0, lastBossMilestone = 0;
let victoryTimer = 0;
let scorePopups = [];         // floating +1 texts

// ═══════════════════════════════════════════════════════════════
//  PIG
// ═══════════════════════════════════════════════════════════════
let pig = mkPig();
function mkPig() {
  return {
    x: 170, y: 260,
    vx: 0, vy: 0,
    onCloud: null,
    coyoteTimer: 0,
    canDoubleJump: false,   // другий стрибок у повітрі
    malfunction: false, malfTimer: 0, malfLevel: 0, malfDir: 1,
    invincible: 0,
    wFlap: 0, wDir: 1,
    alive: true,
  };
}

// ═══════════════════════════════════════════════════════════════
//  CLOUDS  (два шари)
// ═══════════════════════════════════════════════════════════════
let clouds = [];       // білі — платформи для стрибків
let stormClouds = [];  // чорні — вгорі, тільки заважають
let vortices = [];     // вихори — з'являються після 30
let blackHoles = [];   // чорні діри — після 50
let propellers = [];   // пропелери — після 75
let cloudIdGen = 0;

function cloudSpd()  { return 0.75 + score * 0.003; }
function cloudGap()  { return Math.min(MAX_H_GAP, 55 + score * 0.09); }
function cloudMinW() { return Math.max(95, 175 - score * 0.05); }

// ── Біла платформа ──
function mkCloud(x, prevY) {
  const w = cloudMinW() + Math.random() * 55;
  const h = 28 + Math.random() * 22;

  const baseY  = (prevY !== undefined) ? prevY : (SKY_H * 0.65);
  const cloudTop = SKY_H * 0.35;
  const minY   = Math.max(cloudTop,        baseY - MAX_JUMP_UP);
  const maxY   = Math.min(SKY_H - h - 55,  baseY + MAX_JUMP_DOWN);
  const y = minY + Math.random() * Math.max(0, maxY - minY);

  return {
    id: ++cloudIdGen,
    x, y, w, h,
    storm: false,
    ltTimer: 0, ltInterval: 9999, bolt: null,
  };
}

// ── Чорна грозова хмара (верхній шар) ──
function mkStormCloud(x) {
  const w = 110 + Math.random() * 90;
  const h = 32 + Math.random() * 20;
  // Завжди у верхній смузі: 18..SKY_H*0.22
  const y = 18 + Math.random() * (SKY_H * 0.20);
  return {
    id: ++cloudIdGen,
    x, y, w, h,
    storm: true,
    ltTimer:    40 + Math.floor(Math.random() * 60),
    ltInterval: 80 + Math.random() * 140,
    bolt: null,
  };
}

// ── Вихор ──
function mkVortex(x) {
  return {
    x, y: 60 + Math.random() * (SKY_H - 140),
    r: 28 + Math.random() * 18,
    spin: 0, spinSpd: 0.06 + Math.random() * 0.05,
    dead: false,
  };
}

// ── Чорна діра ──
function mkBlackHole(x) {
  return {
    x, y: 55 + Math.random() * (SKY_H - 130),
    r: 22 + Math.random() * 12,
    pulse: 0,
    dead: false,
  };
}

// ── Пропелер ──
function mkPropeller(x) {
  return {
    x, y: 70 + Math.random() * (SKY_H - 160),
    r: 34 + Math.random() * 16,   // радіус обертання лопастей
    blade: 0,
    bladeCount: 2 + Math.floor(Math.random() * 3),  // 2-4 лопасті
    dead: false,
  };
}

function initClouds() {
  clouds = [];
  stormClouds = [];

  const startY = 295;
  clouds.push({ id: ++cloudIdGen, x: 40, y: startY, w: 230, h: 44,
    storm: false, ltTimer: 0, ltInterval: 9999, bolt: null });
  let nx = 330, prevY = startY;
  for (let i = 0; i < 10; i++) {
    const nc = mkCloud(nx, prevY);
    clouds.push(nc);
    prevY = nc.y;
    nx += nc.w + cloudGap() + Math.random() * 30;
  }

  // Грозові хмари — тільки якщо score >= 80, але кілька штук зробимо одразу
  // (вони з'являться поступово через update)
}

function mkBolt(cx, ty) {
  const segs = [{ x: cx, y: ty }];
  let lx = cx, ly = ty;
  while (ly < SKY_H - 5) {
    lx += (Math.random() - 0.5) * 48;
    ly += 32 + Math.random() * 18;
    segs.push({ x: lx, y: Math.min(ly, SKY_H) });
  }
  return { segs, life: 32, maxLife: 32, cx };
}

// ═══════════════════════════════════════════════════════════════
//  DRONES
// ═══════════════════════════════════════════════════════════════
let drones = [];

function mkDrone(x, y) {
  return {
    x, y, w: 56, h: 28,
    rotor: 0,
    falling: false, fallVy: 0,
    rot: 0, alpha: 1,
    dead: false, scored: false,
  };
}

// ═══════════════════════════════════════════════════════════════
//  PARTICLES
// ═══════════════════════════════════════════════════════════════
let particles = [];

function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * (spd || 6);
    particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s - 2,
      color, life: 28 + Math.random() * 28, maxLife: 56, size: 2 + Math.random() * 3 });
  }
}

function addScorePopup(x, y) {
  scorePopups.push({ x, y, vy: -2, life: 45, maxLife: 45 });
}

// ═══════════════════════════════════════════════════════════════
//  BOSSES
// ═══════════════════════════════════════════════════════════════
const BOSSES = [
  { at: 10,  name: 'Порошенко',  sub: 'Шоколадний барон', emoji: '🍫', bg: '#78350f' },
  { at: 20,  name: 'Свириденко', sub: 'Менеджер реформ',  emoji: '💼', bg: '#4c1d95' },
  { at: 30,  name: 'Вакарчук',   sub: 'Рок-депутат',      emoji: '🎸', bg: '#7f1d1d' },
  { at: 40,  name: 'Арахамія',   sub: 'Переговорник',     emoji: '🤝', bg: '#713f12' },
  { at: 50,  name: 'Гетьманцев', sub: 'Директор ДПС',     emoji: '💵', bg: '#14532d' },
  { at: 60,  name: 'Портников',  sub: 'Медіабос',         emoji: '📺', bg: '#7c2d12' },
  { at: 70,  name: 'Стефанчук',  sub: 'Спікер',           emoji: '🔨', bg: '#164e63' },
  { at: 80,  name: 'Єрмак',      sub: 'Тіньовик',         emoji: '🕵️', bg: '#44337a' },
  { at: 90,  name: 'Зеленський', sub: 'Президент',        emoji: '🎬', bg: '#1c4532' },
];

// ═══════════════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════════════
const keys = {};
let jumpQ = false;
let jumpHeld = false;  // чи тримаємо кнопку — для ширяння
let tLeft = false, tRight = false;

window.addEventListener('keydown', e => {
  const was = keys[e.code];
  keys[e.code] = true;
  if (['Space','ArrowUp','KeyW'].includes(e.code)) jumpHeld = true;
  if (!was) {
    if (gState === 'playing') {
      if (['Space','ArrowUp','KeyW'].includes(e.code)) jumpQ = true;
    } else {
      if (['Space','Enter'].includes(e.code)) newGame();
    }
  }
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))
    e.preventDefault();
});
window.addEventListener('keyup', e => {
  keys[e.code] = false;
  if (['Space','ArrowUp','KeyW'].includes(e.code)) jumpHeld = false;
});

C.addEventListener('touchstart', e => {
  e.preventDefault();
  if (gState !== 'playing') { newGame(); return; }
  for (const t of e.changedTouches) {
    const r = C.getBoundingClientRect();
    const tx = (t.clientX - r.left) / r.width * W;
    const ty = (t.clientY - r.top)  / r.height * H;
    if (ty < H * 0.55) jumpQ = true;
    else if (tx < W * 0.5) tLeft  = true;
    else                    tRight = true;
  }
}, { passive: false });
C.addEventListener('touchend',   e => { e.preventDefault(); tLeft = tRight = false; }, { passive: false });
C.addEventListener('touchcancel',e => { e.preventDefault(); tLeft = tRight = false; }, { passive: false });

// ═══════════════════════════════════════════════════════════════
//  GAME CONTROL
// ═══════════════════════════════════════════════════════════════
function newGame() {
  gState = 'playing';
  score = 0; lives = 3; frame = 0;
  radaCrack = 0;
  bossQueue = null; bossTimer = 0; lastBossMilestone = 0;
  victoryTimer = 0;
  drones = []; particles = []; scorePopups = [];
  stormClouds = []; vortices = []; blackHoles = []; propellers = [];
  pig = mkPig();
  initClouds();
}

function addPts(n, x, y) {
  score += n;
  radaCrack = Math.min(score * 10, 1000);
  addScorePopup(x, y);
  SFX.drone();

  // Boss milestones
  const nextBoss = BOSSES.find(b => b.at <= score && b.at > lastBossMilestone);
  if (nextBoss) { bossQueue = nextBoss; bossTimer = 600; lastBossMilestone = nextBoss.at; SFX.boss(); }
  // Victory
  if (score >= 100 && gState === 'playing' && victoryTimer === 0) {
    victoryTimer = 220;
    SFX.victory();
  }
}

function hitLife() {
  if (pig.invincible > 0) return;
  SFX.hitLife();
  lives--;
  burst(pig.x, pig.y, '#ff6b6b', 22, 9);
  if (lives <= 0) { gState = 'gameover'; return; }
  pig.invincible = 150;
  pig.malfunction = false; pig.malfTimer = 0; pig.malfLevel = 0; pig.malfDir = 1;
  pig.vy = 0; pig.vx = 0; pig.onCloud = null; pig.coyoteTimer = 0;
  const safe = clouds.slice()
    .filter(c => !c.storm && c.x + c.w/2 > 60 && c.x + c.w/2 < W - 60)
    .sort((a, b) => Math.abs(a.x+a.w/2 - 220) - Math.abs(b.x+b.w/2 - 220))[0];
  if (safe) {
    pig.x = safe.x + safe.w / 2;
    pig.y = safe.y - PIG_H / 2 - 1;
    pig.onCloud = safe;
  } else {
    pig.x = 180; pig.y = 100;
  }
}

// ═══════════════════════════════════════════════════════════════
//  UPDATE
// ═══════════════════════════════════════════════════════════════
function update() {
  if (gState !== 'playing') return;
  frame++;

  // ── Victory countdown ──
  if (victoryTimer > 0) {
    victoryTimer--;
    if (victoryTimer <= 0) { gState = 'victory'; return; }
  }

  // ── Wing flap animation ──
  pig.wFlap += 0.19 * pig.wDir;
  if (Math.abs(pig.wFlap) > 0.5) pig.wDir *= -1;

  // ── Malfunction/invincibility timers ──
  if (pig.malfunction) {
    pig.malfTimer--;
    if (pig.malfTimer <= 0) {
      pig.malfLevel = Math.max(0, pig.malfLevel - 1);
      if (pig.malfLevel === 0) {
        pig.malfunction = false;
      } else {
        // Ще є рівні — відновлюємо таймер для наступного спаду
        pig.malfTimer = 220;
      }
    }
  }
  if (pig.invincible > 0) pig.invincible--;

  // ── Coyote time ──
  if (pig.onCloud) {
    pig.coyoteTimer = 9;
  } else {
    if (pig.coyoteTimer > 0) pig.coyoteTimer--;
  }

  // ── Move pig WITH cloud ──
  if (pig.onCloud) {
    pig.x -= cloudSpd();
    // Check if pig slid off cloud edge
    const c = pig.onCloud;
    if (pig.x + PIG_W*0.4 < c.x || pig.x - PIG_W*0.4 > c.x + c.w) {
      pig.onCloud = null;
    }
  }

  // ── Horizontal input ──
  const goL = keys['ArrowLeft']  || keys['KeyA'] || tLeft;
  const goR = keys['ArrowRight'] || keys['KeyD'] || tRight;
  let ax = 0;
  if (goL) ax -= WALK_SPEED;
  if (goR) ax += WALK_SPEED;
  if (pig.malfunction) ax += pig.malfDir * ((2.5 + pig.malfLevel * 1.8) + Math.sin(frame * (0.3 + pig.malfLevel * 0.15)) * (2 + pig.malfLevel * 1.2));
  pig.vx += (ax - pig.vx) * 0.17;

  // ── Jump ──
  if (jumpQ) {
    if (pig.onCloud || pig.coyoteTimer > 0) {
      pig.vy = JUMP_FORCE;
      pig.onCloud = null;
      pig.coyoteTimer = 0;
      pig.canDoubleJump = true;
      SFX.jump();
    } else if (pig.canDoubleJump) {
      pig.vy = JUMP2_FORCE;
      pig.canDoubleJump = false;
      burst(pig.x, pig.y + 10, 'rgba(255,255,255,0.9)', 10, 4);
      SFX.jump2();
    }
    jumpQ = false;
  }

  // ── Gravity (менша поки ширяємо вгору з кнопкою) ──
  const gliding = jumpHeld && pig.vy < 0 && !pig.onCloud;
  pig.vy += GRAVITY * (gliding ? GLIDE_REDUCE : 1.0);
  // Крила не дають падати каменем — обмежуємо швидкість падіння
  if (pig.vy > TERMINAL_VY) pig.vy = TERMINAL_VY;
  // Повітряний опір по горизонталі (крила)
  if (!pig.onCloud) pig.vx *= WING_DRAG;

  // ── Apply velocity ──
  pig.x += pig.vx;
  pig.y += pig.vy;

  // ── Screen bounds ──
  if (pig.x < PIG_W/2)     { pig.x = PIG_W/2;     pig.vx = 0; }
  if (pig.x > W - PIG_W/2) { pig.x = W - PIG_W/2; pig.vx = 0; }
  if (pig.y < PIG_H/2 + 2) { pig.y = PIG_H/2 + 2; pig.vy = Math.abs(pig.vy) * 0.3; }

  // ── Fell off screen ──
  if (pig.y > H + 50) { hitLife(); return; }

  // ── Cloud collision ──
  pig.onCloud = null;
  const pigBottom = pig.y + PIG_H / 2;
  const prevBottom = pigBottom - pig.vy;  // where pig was last frame
  for (const c of clouds) {
    if (
      pig.vy >= 0 &&
      pig.x + PIG_W/2 - 10 > c.x &&
      pig.x - PIG_W/2 + 10 < c.x + c.w &&
      pigBottom >= c.y - 2 &&
      prevBottom <= c.y + c.h * 0.55
    ) {
      pig.y  = c.y - PIG_H / 2;
      pig.vy = 0;
      pig.onCloud = c;
      pig.canDoubleJump = false;
      SFX.land();
      break;
    }
  }

  // ── Update / scroll білих хмар ──
  const spd = cloudSpd();
  for (const c of clouds) {
    c.x -= spd;
  }

  clouds = clouds.filter(c => c.x + c.w > -30);
  let rightmost = clouds.reduce((m, c) => Math.max(m, c.x + c.w), 0);
  let prevGenY = clouds.length
    ? clouds.reduce((best, c) => c.x + c.w >= rightmost - 2 ? c.y : best, clouds[clouds.length-1].y)
    : 295;
  while (rightmost < W + 700) {
    const gap = cloudGap() + Math.random() * 40;
    const nc  = mkCloud(rightmost + gap, prevGenY);
    clouds.push(nc);
    prevGenY  = nc.y;
    rightmost = nc.x + nc.w;
  }

  // ── Update / scroll грозових хмар (верхній шар) ──
  const stormSpd = spd * 0.85;   // трохи повільніше — зловісно
  for (const sc of stormClouds) {
    sc.x -= stormSpd;

    sc.ltTimer++;
    if (sc.ltTimer >= sc.ltInterval) {
      sc.ltTimer    = 0;
      sc.ltInterval = 70 + Math.random() * 130;
      const lx = sc.x + sc.w * 0.2 + Math.random() * sc.w * 0.6;
      sc.bolt = mkBolt(lx, sc.y + sc.h);
      burst(lx, sc.y + sc.h, '#fef08a', 5, 4);
    }

    if (sc.bolt) {
      sc.bolt.life--;
      if (sc.bolt.life > 22 && pig.invincible <= 0 && !pig.malfunction) {
        const dx = Math.abs(pig.x - sc.bolt.cx);
        if (dx < 42 && pig.y + PIG_H/2 > sc.y + sc.h && pig.y - PIG_H/2 < SKY_H) {
          pig.malfunction = true;
          pig.malfLevel   = Math.min(pig.malfLevel + 1, 5);
          pig.malfDir     = Math.random() < 0.5 ? 1 : -1;
          pig.malfTimer   = 290;
          pig.invincible  = 100;
          SFX.lightning();
          burst(pig.x, pig.y, '#fde68a', 22, 8);
          burst(pig.x, pig.y, '#fb923c', 12, 5);
        }
      }
      if (sc.bolt.life <= 0) sc.bolt = null;
    }
  }

  stormClouds = stormClouds.filter(sc => sc.x + sc.w > -30);

  // ── t = прогрес 0→1 (від 0 до $100M) ──
  const t100 = Math.min(score / 100, 1);

  // ── Грозові хмари: з'являються з 20%, макс 7 штук до кінця ──
  if (score >= 20) {
    const stormRight = stormClouds.reduce((m, c) => Math.max(m, c.x + c.w), 0);
    const maxStorm   = Math.min(7, 1 + Math.floor((score - 20) / 10));
    const stormGap   = Math.max(100, 260 - (score - 20) * 2.5);
    if (stormClouds.length < maxStorm && stormRight < W + 400) {
      stormClouds.push(mkStormCloud(Math.max(W + 60, stormRight + stormGap)));
    }
  }

  // ── Вихори: від 30, спочатку рідко, до кінця часто ──
  if (score >= 30) {
    const vProb   = 0.0006 + (score - 30) * 0.00008;
    const maxVort = Math.min(6, 1 + Math.floor((score - 30) / 12));
    if (Math.random() < vProb && vortices.length < maxVort) {
      vortices.push(mkVortex(W + 50));
    }
  }
  for (const v of vortices) {
    v.x   -= spd * 0.9;
    v.spin += v.spinSpd;
    if (!v.dead && pig.invincible <= 0) {
      const dx = pig.x - v.x, dy = pig.y - v.y;
      if (Math.sqrt(dx*dx + dy*dy) < v.r + 18) {
        v.dead = true;
        pig.malfunction = true;
        pig.malfLevel   = Math.min(pig.malfLevel + 1, 5);
        pig.malfDir     = Math.random() < 0.5 ? 1 : -1;
        pig.malfTimer   = 250;
        pig.invincible  = 90;
        SFX.vortex();
        burst(v.x, v.y, '#a78bfa', 20, 7);
        burst(pig.x, pig.y, '#c4b5fd', 12, 5);
      }
    }
  }
  vortices = vortices.filter(v => v.x + v.r > -40 && !v.dead);

  // ── Чорні діри: від 50, рідко → до 3 штук ──
  if (score >= 50) {
    const bhProb   = 0.0003 + (score - 50) * 0.00006;
    const maxBH    = Math.min(3, 1 + Math.floor((score - 50) / 20));
    if (Math.random() < bhProb && blackHoles.length < maxBH) {
      blackHoles.push(mkBlackHole(W + 50));
    }
  }
  for (const bh of blackHoles) {
    bh.x    -= spd * 0.7;
    bh.pulse = (bh.pulse + 0.07) % (Math.PI * 2);
    if (!bh.dead && pig.invincible <= 0) {
      const dx = pig.x - bh.x, dy = pig.y - bh.y;
      if (Math.sqrt(dx*dx + dy*dy) < bh.r + 14) {
        bh.dead = true;
        SFX.teleport();
        burst(pig.x, pig.y, '#818cf8', 28, 10);
        pig.x  = W - 80;
        pig.y  = 55;
        pig.vy = 0; pig.vx = 0;
        pig.onCloud = null;
        pig.invincible = 80;
        pig.canDoubleJump = true;
        burst(W - 80, 55, '#a5f3fc', 22, 8);
      }
    }
  }
  blackHoles = blackHoles.filter(bh => bh.x + bh.r > -40 && !bh.dead);

  // ── Пропелери: від 75, спочатку 1, потім до 5 ──
  if (score >= 75) {
    const pProb  = 0.0008 + (score - 75) * 0.0001;
    const maxPr  = Math.min(5, 1 + Math.floor((score - 75) / 6));
    if (Math.random() < pProb && propellers.length < maxPr) {
      propellers.push(mkPropeller(W + 60));
    }
  }
  for (const p of propellers) {
    p.x    -= spd * 1.05;
    p.blade = (p.blade + 0.18 + score * 0.0008) % (Math.PI * 2);
    if (!p.dead && pig.invincible <= 0) {
      const dx = Math.abs(pig.x - p.x), dy = Math.abs(pig.y - p.y);
      if (dx < p.r + 20 && dy < p.r + 20) {
        p.dead = true;
        pig.malfunction = true;
        pig.malfLevel   = Math.min(pig.malfLevel + 1, 5);
        pig.malfDir     = Math.random() < 0.5 ? 1 : -1;
        pig.malfTimer   = 270;
        pig.invincible  = 100;
        SFX.malfunction();
        burst(p.x, p.y, '#fbbf24', 18, 7);
        burst(pig.x, pig.y, '#fb923c', 12, 5);
      }
    }
  }
  propellers = propellers.filter(p => p.x + p.r > -50 && !p.dead);
  const droneProb   = 0.003 + score * 0.00018;
  const activeDrones = drones.filter(d => !d.falling).length;
  if (Math.random() < droneProb && activeDrones < 7) {
    // Дрони літають у верхній третині екрана
    drones.push(mkDrone(W + 62, 28 + Math.random() * (SKY_H * 0.32)));
  }

  // ── Update drones ──
  for (const d of drones) {
    if (d.falling) {
      d.fallVy += 0.58;
      d.y      += d.fallVy;
      d.rot    += 0.2;
      d.alpha   = Math.max(0, d.alpha - 0.014);
    } else {
      d.vx = -(spd * 0.72 + 0.65);
      d.x += d.vx;
      d.rotor += 0.52;

      // Pig ↔ drone collision
      if (!d.scored && pig.invincible <= 0) {
        const dx = Math.abs(pig.x - (d.x + d.w/2));
        const dy = Math.abs(pig.y - (d.y + d.h/2));
        if (dx < PIG_W/2 + d.w/2 - 9 && dy < PIG_H/2 + d.h/2 - 5) {
          d.scored  = true;
          d.falling = true;
          d.fallVy  = 2;
          pig.invincible = 20;
          addPts(1, d.x + d.w/2, d.y);
          burst(d.x + d.w/2, d.y + d.h/2, '#94a3b8', 16, 6);
          burst(d.x + d.w/2, d.y + d.h/2, '#ef4444', 8, 4);
        }
      }
    }
    d.dead = d.y > H + 80 || d.alpha <= 0 || d.x < -120;
  }
  drones = drones.filter(d => !d.dead);

  // ── Particles ──
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.22; p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  // ── Score popups ──
  for (const s of scorePopups) { s.y += s.vy; s.life--; }
  scorePopups = scorePopups.filter(s => s.life > 0);

  // ── Boss timer ──
  if (bossQueue) { bossTimer--; if (bossTimer <= 0) bossQueue = null; }

  // ── Debris from Rada when cracking ──
  const t = radaCrack / 1000;
  if (t > 0.25 && Math.random() < t * 0.12) {
    burst(50 + Math.random() * (W - 100), H - RADA_H + Math.random() * 20,
      t > 0.7 ? '#991b1b' : '#d97706', 2, 3);
  }
}

// ═══════════════════════════════════════════════════════════════
//  RENDER HELPERS
// ═══════════════════════════════════════════════════════════════
function lerp(a, b, t) { return a + (b - a) * t; }
function lerpClr(r1,g1,b1, r2,g2,b2, t) {
  return `rgb(${~~lerp(r1,r2,t)},${~~lerp(g1,g2,t)},${~~lerp(b1,b2,t)})`;
}
function rr(x, y, w, h, r) {   // rounded rect path
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y,   x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x,   y+h, r);
  ctx.arcTo(x,   y+h, x,   y,   r);
  ctx.arcTo(x,   y,   x+w, y,   r);
  ctx.closePath();
}

// ═══════════════════════════════════════════════════════════════
//  DRAW SKY
// ═══════════════════════════════════════════════════════════════
function drawSky() {
  const t = Math.min(radaCrack / 900, 1);
  const g = ctx.createLinearGradient(0, 0, 0, SKY_H);
  g.addColorStop(0, lerpClr(74,144,255,  10,14,60,  t));
  g.addColorStop(1, lerpClr(160,210,230, 25,35,80,  t));
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, SKY_H);

  // Sun
  if (t < 0.65) {
    const sa = Math.max(0, 1 - t / 0.65);
    ctx.save(); ctx.globalAlpha = sa;
    ctx.fillStyle = '#fcd34d'; ctx.shadowColor = '#fcd34d'; ctx.shadowBlur = 45;
    ctx.beginPath(); ctx.arc(W - 82, 60, 30, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Moon + Stars
  if (t > 0.35) {
    const ma = Math.min(1, (t - 0.35) / 0.28);
    ctx.save(); ctx.globalAlpha = ma;
    ctx.fillStyle = '#e2e8f0'; ctx.shadowColor = '#c7d2fe'; ctx.shadowBlur = 22;
    ctx.beginPath(); ctx.arc(W - 82, 58, 26, 0, Math.PI*2); ctx.fill();
    ctx.shadowBlur = 0;
    for (let i = 0; i < 50; i++) {
      const sx = ((i * 167 + 40) % (W - 80)) + 20;
      const sy = (i * 89 + 10) % (SKY_H * 0.68);
      const ss = 0.6 + (i % 4) * 0.4;
      ctx.globalAlpha = ma * (0.35 + (i%3)*0.3) * (0.5 + Math.sin(frame*0.035+i*0.7)*0.5);
      ctx.fillStyle = 'white';
      ctx.beginPath(); ctx.arc(sx, sy, ss, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }

  // Distant smoke/haze when Rada is burning
  if (t > 0.5) {
    ctx.save(); ctx.globalAlpha = (t - 0.5) * 0.5;
    const sg = ctx.createLinearGradient(0, SKY_H - 60, 0, SKY_H);
    sg.addColorStop(0, 'transparent');
    sg.addColorStop(1, 'rgba(200,60,20,0.6)');
    ctx.fillStyle = sg;
    ctx.fillRect(0, SKY_H - 80, W, 80);
    ctx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════
//  DRAW CLOUD
// ═══════════════════════════════════════════════════════════════
function drawCloud(c) {
  const { x, y, w, h, storm } = c;
  ctx.save();
  const puffs = [
    [0.5,  0.55, 0.42, 0.46],
    [0.25, 0.65, 0.25, 0.37],
    [0.75, 0.65, 0.25, 0.37],
    [0.38, 0.34, 0.28, 0.40],
    [0.63, 0.34, 0.26, 0.37],
    [0.5,  0.18, 0.20, 0.32],
  ];
  if (storm) {
    ctx.fillStyle = '#4b5563';
    ctx.shadowColor = '#818cf8'; ctx.shadowBlur = 16;
  } else {
    ctx.fillStyle = 'rgba(255,255,255,0.95)';
    ctx.shadowColor = 'rgba(186,230,253,0.55)'; ctx.shadowBlur = 14;
  }
  for (const [px, py, rw, rh] of puffs) {
    ctx.beginPath();
    ctx.ellipse(x + w*px, y + h*py, w*rw, h*rh, 0, 0, Math.PI*2);
    ctx.fill();
  }
  // flat bottom
  ctx.fillRect(x + w*0.07, y + h*0.58, w * 0.86, h * 0.42);
  ctx.shadowBlur = 0;

  if (storm) {
    ctx.globalAlpha = 0.28;
    ctx.fillStyle = '#1e1b4b';
    for (const [px, py, rw, rh] of puffs) {
      ctx.beginPath();
      ctx.ellipse(x + w*px, y + h*py, w*rw, h*rh, 0, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.fillRect(x + w*0.07, y + h*0.58, w * 0.86, h * 0.42);
    ctx.globalAlpha = 1;
    ctx.font = `${Math.max(13, h * 0.75)}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.shadowColor = '#fbbf24'; ctx.shadowBlur = 12;
    ctx.fillText('⚡', x + w/2, y + h * 0.52);
    ctx.shadowBlur = 0; ctx.textBaseline = 'alphabetic';
  }

  // Lightning bolt
  if (c.bolt) {
    const alpha = c.bolt.life / c.bolt.maxLife;
    const s = c.bolt.segs;
    ctx.save(); ctx.globalAlpha = alpha;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(254,240,138,0.3)'; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(s[0].x, s[0].y);
    s.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
    ctx.strokeStyle = '#fef08a'; ctx.lineWidth = 2.5;
    ctx.shadowColor = '#fef08a'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.moveTo(s[0].x, s[0].y);
    s.forEach(p => ctx.lineTo(p.x, p.y)); ctx.stroke();
    ctx.restore();
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
//  DRAW PIG
// ═══════════════════════════════════════════════════════════════
function drawPig(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  if (p.invincible > 0 && Math.floor(p.invincible / 7) % 2) ctx.globalAlpha = 0.32;

  const fl = Math.sin(p.wFlap);          // left wing flap
  const fr = p.malfunction
    ? Math.sin(p.wFlap * 2.7 + 1.3)      // erratic right wing
    : fl;

  // ── Left wing ──
  ctx.save(); ctx.translate(-24, -7); ctx.rotate(-fl * 0.42);
  ctx.fillStyle = 'rgba(255,255,255,0.96)';
  ctx.strokeStyle = '#dbeafe'; ctx.lineWidth = 1;
  ctx.shadowColor = 'rgba(147,197,253,0.5)'; ctx.shadowBlur = 9;
  ctx.beginPath(); ctx.ellipse(-6, 0, 32, 14, -0.12, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.strokeStyle = 'rgba(147,197,253,0.45)'; ctx.lineWidth = 0.8;
  for (let i = 0; i < 5; i++) {
    ctx.beginPath(); ctx.moveTo(-22+i*8, 0); ctx.lineTo(-21+i*8, -12); ctx.stroke();
  }
  ctx.restore();

  // ── Right wing ──
  ctx.save(); ctx.translate(24, -7); ctx.rotate(fr * 0.42);
  ctx.fillStyle = p.malfunction
    ? `rgba(${200 + p.malfLevel*10},${Math.max(60, 120 - p.malfLevel*30)},${Math.max(20, 80 - p.malfLevel*20)},0.90)`
    : 'rgba(255,255,255,0.96)';
  ctx.strokeStyle = p.malfunction ? `hsl(${Math.max(0,30-p.malfLevel*6)},95%,55%)` : '#dbeafe'; ctx.lineWidth = 1;
  ctx.shadowColor = p.malfunction ? `rgba(251,${Math.max(50,146-p.malfLevel*30)},60,0.6)` : 'rgba(147,197,253,0.5)';
  ctx.shadowBlur = 9;
  ctx.beginPath(); ctx.ellipse(6, 0, 32, 14, 0.12, 0, Math.PI*2);
  ctx.fill(); ctx.stroke();
  ctx.restore();
  ctx.shadowBlur = 0;

  // ── Body ──
  ctx.fillStyle = '#fecdd3'; ctx.strokeStyle = '#fda4af'; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.ellipse(0, 9, 27, 22, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();

  // ── Head ──
  ctx.fillStyle = '#fecdd3';
  ctx.beginPath(); ctx.ellipse(17, -7, 22, 20, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();

  // ── Ear ──
  ctx.fillStyle = '#fecdd3';
  ctx.beginPath(); ctx.ellipse(9, -24, 7.5, 9.5, -0.35, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#fda4af';
  ctx.beginPath(); ctx.ellipse(9, -24, 4.5, 6.5, -0.35, 0, Math.PI*2); ctx.fill();

  // ── Snout ──
  ctx.fillStyle = '#fb7185'; ctx.strokeStyle = '#f43f5e'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(31, -2, 13, 10, 0, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#be123c';
  ctx.beginPath(); ctx.ellipse(28, -3, 3, 2.2, 0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(34, -3, 3, 2.2, -0.15, 0, Math.PI*2); ctx.fill();

  // ── Eye ──
  ctx.fillStyle = '#0f172a';
  ctx.beginPath(); ctx.arc(24, -15, 5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = 'white';
  ctx.beginPath(); ctx.arc(25.5, -16.5, 2, 0, Math.PI*2); ctx.fill();

  // ── Halo ──
  ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 3;
  ctx.shadowColor = '#fde68a'; ctx.shadowBlur = 14;
  ctx.beginPath(); ctx.ellipse(17, -33, 14, 5.5, 0, 0, Math.PI*2); ctx.stroke();
  ctx.shadowBlur = 0;

  // ── Curly tail ──
  ctx.strokeStyle = '#fda4af'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(-23, 13);
  ctx.bezierCurveTo(-40, 4, -48, 26, -35, 21);
  ctx.bezierCurveTo(-27, 17, -30, 9, -23, 13);
  ctx.stroke();

  // ── Malfunction sparks ──
  if (p.malfunction) {
    for (let i = 0; i < 4; i++) {
      ctx.fillStyle = `rgba(250,204,21,${Math.random()})`;
      ctx.beginPath();
      ctx.arc(-22+Math.random()*44, -24+Math.random()*40, 1.5+Math.random()*3, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
//  DRAW MONEY PACK ($1M)
// ═══════════════════════════════════════════════════════════════
function drawDrone(d) {
  ctx.save();
  ctx.globalAlpha = d.alpha;
  ctx.translate(d.x + d.w/2, d.y + d.h/2);
  ctx.rotate(d.rot);

  const pw = 38, ph = 26;

  // Стрічка (обв'язка)
  ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-pw/2, 0); ctx.lineTo(pw/2, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -ph/2); ctx.lineTo(0, ph/2); ctx.stroke();

  // Пачка купюр — кілька шарів зі зсувом
  for (let i = 3; i >= 0; i--) {
    const ox = i * 1.2, oy = -i * 1.5;
    ctx.fillStyle = i === 0 ? '#16a34a' : '#15803d';
    ctx.strokeStyle = '#14532d'; ctx.lineWidth = 0.8;
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(-pw/2 + ox, -ph/2 + oy, pw, ph, 4);
    else ctx.rect(-pw/2 + ox, -ph/2 + oy, pw, ph);
    ctx.fill(); ctx.stroke();
  }

  // Портрет на купюрі (кружечок)
  ctx.fillStyle = '#dcfce7';
  ctx.beginPath(); ctx.ellipse(0, -2, 8, 9, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#166534'; ctx.lineWidth = 0.8;
  ctx.beginPath(); ctx.ellipse(0, -2, 8, 9, 0, 0, Math.PI*2); ctx.stroke();

  // Знак долара
  ctx.fillStyle = '#166534';
  ctx.font = 'bold 13px Arial';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('$', 0, -2);

  // "1M" напис
  ctx.fillStyle = '#dcfce7';
  ctx.font = 'bold 7.5px Arial';
  ctx.fillText('1MLN', 0, ph/2 - 7);

  // Стрічка поверх
  ctx.strokeStyle = '#dc2626'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(-pw/2+2, 0); ctx.lineTo(pw/2-2, 0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0, -ph/2+2); ctx.lineTo(0, ph/2-2); ctx.stroke();
  // Бантик
  ctx.fillStyle = '#ef4444';
  ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fca5a5';
  ctx.beginPath(); ctx.arc(0, 0, 2, 0, Math.PI*2); ctx.fill();

  ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
//  DRAW VORTEX
// ═══════════════════════════════════════════════════════════════
function drawVortex(v) {
  ctx.save();
  ctx.translate(v.x, v.y);
  // Спіральні кільця
  for (let i = 4; i >= 1; i--) {
    const ri = v.r * (i / 4);
    const a  = 0.18 + (4 - i) * 0.18;
    ctx.save();
    ctx.rotate(v.spin + i * 0.9);
    ctx.strokeStyle = `rgba(167,139,250,${a})`;
    ctx.lineWidth   = 2.5 - i * 0.3;
    ctx.beginPath();
    ctx.ellipse(0, 0, ri, ri * 0.45, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }
  // Центр
  const cg = ctx.createRadialGradient(0,0,2, 0,0,v.r*0.55);
  cg.addColorStop(0, 'rgba(196,181,253,0.85)');
  cg.addColorStop(1, 'rgba(109,40,217,0)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.arc(0,0, v.r*0.55, 0, Math.PI*2); ctx.fill();
  // Іконка
  ctx.font = `${~~(v.r * 0.9)}px serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('🌪️', 0, 0);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
//  DRAW BLACK HOLE
// ═══════════════════════════════════════════════════════════════
function drawBlackHole(bh) {
  ctx.save();
  ctx.translate(bh.x, bh.y);
  const pulse = Math.sin(bh.pulse);
  const outer = bh.r + 10 + pulse * 5;

  // Зовнішнє сяйво
  const gOuter = ctx.createRadialGradient(0,0,bh.r*0.4, 0,0,outer*1.6);
  gOuter.addColorStop(0, 'rgba(99,102,241,0.0)');
  gOuter.addColorStop(0.5,'rgba(99,102,241,0.35)');
  gOuter.addColorStop(1, 'rgba(99,102,241,0)');
  ctx.fillStyle = gOuter;
  ctx.beginPath(); ctx.arc(0,0,outer*1.6,0,Math.PI*2); ctx.fill();

  // Акреційний диск
  for (let i = 3; i >= 1; i--) {
    ctx.save();
    ctx.rotate(bh.pulse * (i % 2 === 0 ? 1 : -1) * 0.4);
    ctx.strokeStyle = `rgba(139,92,246,${0.15 * i})`;
    ctx.lineWidth   = 4;
    ctx.beginPath();
    ctx.ellipse(0,0, outer + i*5, (outer + i*5)*0.22, 0, 0, Math.PI*2);
    ctx.stroke();
    ctx.restore();
  }

  // Чорне тіло
  const gCore = ctx.createRadialGradient(0,0,0, 0,0,bh.r);
  gCore.addColorStop(0,   '#000000');
  gCore.addColorStop(0.7, '#0f0c29');
  gCore.addColorStop(1,   'rgba(99,102,241,0.7)');
  ctx.fillStyle = gCore;
  ctx.shadowColor = '#6366f1'; ctx.shadowBlur = 22;
  ctx.beginPath(); ctx.arc(0,0,bh.r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;

  // Зірки, що засмоктуються
  for (let i = 0; i < 5; i++) {
    const ang = bh.pulse * 2 + i * 1.26;
    const dist = bh.r * 1.3 + Math.sin(bh.pulse * 3 + i) * 8;
    ctx.fillStyle = `rgba(255,255,255,${0.4 + Math.sin(bh.pulse+i)*0.4})`;
    ctx.beginPath();
    ctx.arc(Math.cos(ang)*dist, Math.sin(ang)*dist, 1.5, 0, Math.PI*2);
    ctx.fill();
  }

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
//  DRAW PROPELLER
// ═══════════════════════════════════════════════════════════════
function drawPropeller(p) {
  ctx.save();
  ctx.translate(p.x, p.y);

  // Небезпечна зона (ледь помітна)
  const dz = ctx.createRadialGradient(0,0,p.r*0.5, 0,0,p.r+12);
  dz.addColorStop(0,  'rgba(239,68,68,0)');
  dz.addColorStop(0.7,'rgba(239,68,68,0.10)');
  dz.addColorStop(1,  'rgba(239,68,68,0)');
  ctx.fillStyle = dz;
  ctx.beginPath(); ctx.arc(0,0,p.r+12,0,Math.PI*2); ctx.fill();

  // Лопасті
  ctx.save();
  ctx.rotate(p.blade);
  for (let i = 0; i < p.bladeCount; i++) {
    ctx.save();
    ctx.rotate((Math.PI * 2 / p.bladeCount) * i);
    // Лопасть — видовжений еліпс
    const g = ctx.createLinearGradient(0, -p.r, 0, p.r);
    g.addColorStop(0,   '#94a3b8');
    g.addColorStop(0.5, '#cbd5e1');
    g.addColorStop(1,   '#64748b');
    ctx.fillStyle = g;
    ctx.strokeStyle = '#475569'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.ellipse(0, 0, p.r * 0.18, p.r, 0, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.restore();
  }
  ctx.restore();

  // Вісь (втулка)
  ctx.fillStyle = '#1e293b';
  ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 2;
  ctx.shadowColor = '#f59e0b'; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(0, 0, 7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.shadowBlur = 0;

  // Попереджувальні смуги на осі
  ctx.fillStyle = '#f59e0b';
  ctx.beginPath(); ctx.arc(0, 0, 4, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
//  DRAW RADA (Verkhovna Rada building with crack progression)
// ═══════════════════════════════════════════════════════════════
function drawRada(crack) {
  const t  = crack / 1000;  // 0→1
  const by = H - RADA_H;

  // ── Ground / foundation ──
  ctx.fillStyle = lerpClr(220,200,165,  90,25,10,  t);
  ctx.fillRect(0, by + 68, W, RADA_H - 68);

  // ── Main facade ──
  ctx.fillStyle = lerpClr(210,190,155,  85,20,8,  t);
  ctx.fillRect(35, by + 22, W - 70, 58);

  // ── Dome (disappears > 0.62) ──
  if (t < 0.68) {
    const da = t < 0.55 ? 1 : (0.68 - t) / 0.13;
    ctx.save(); ctx.globalAlpha = da;
    ctx.fillStyle = t > 0.32 ? '#7f1d1d' : '#1d4ed8';
    ctx.shadowColor = ctx.fillStyle; ctx.shadowBlur = t * 22;
    ctx.beginPath(); ctx.ellipse(W/2, by + 20, 92, 50, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = t > 0.32 ? '#991b1b' : '#2563eb'; ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.ellipse(W/2, by + 20, 58, 33, 0, Math.PI, 0); ctx.fill();
    // Напис на куполі
    ctx.save();
    ctx.fillStyle = t > 0.32 ? 'rgba(255,180,180,0.9)' : 'rgba(255,255,255,0.92)';
    ctx.font = 'bold 10px Arial';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    // Купол — верхня напівокружність, центр тексту трохи вище by+20
    ctx.fillText('ВЕРХОВНА', W/2, by - 8);
    ctx.fillText('РАДА', W/2, by + 5);
    ctx.restore();
    ctx.restore();
  }

  // ── Columns ──
  const nCols = 14;
  for (let i = 0; i < nCols; i++) {
    const cx  = 68 + i * (W - 136) / (nCols - 1);
    const ct  = Math.min(1, t + Math.sin(i * 1.9) * 0.08);
    const col = lerpClr(195,172,135,  65,15,8,  ct);
    const cap = lerpClr(175,150,110,  50,10,5,  ct);

    if (t > 0.58 && i % 3 === 1) {
      // Tilted crumbling
      ctx.save();
      ctx.translate(cx, by + 22 + 50);
      ctx.rotate(Math.sin(i * 2.3) * 0.42 * t);
      ctx.fillStyle = col; ctx.fillRect(-8, -50, 16, 50);
      ctx.restore();
    } else if (!(t > 0.82 && i % 5 === 0)) {
      ctx.fillStyle = col; ctx.fillRect(cx - 8, by + 22, 16, 50);
    }

    // Cap
    ctx.fillStyle = cap; ctx.fillRect(cx - 11, by + 22, 22, 8);
  }

  // ── Frieze / top strip ──
  if (t < 0.88) {
    ctx.fillStyle = lerpClr(185,154,25,  120,25,10,  t);
    ctx.fillRect(25, by + 16, W - 50, 11);
  }

  // ── Crack lines ──
  if (t > 0.08) {
    const n = ~~(t * 24);
    ctx.lineCap = 'round';
    for (let i = 0; i < n; i++) {
      const seed1 = (i * 97 + 23) % (W - 80);
      const seed2 = (i * 43 + 11) % 54;
      const intensity = Math.min(1, t + (i % 3) * 0.1);
      ctx.strokeStyle = `rgba(0,0,0,${intensity * 0.65})`;
      ctx.lineWidth = 0.8 + (i % 4) * 0.4;
      ctx.beginPath();
      ctx.moveTo(38 + seed1, by + 25 + seed2);
      const dx = (i % 2 === 0 ? 1 : -1) * (12 + (i%5)*7) * intensity;
      ctx.lineTo(38 + seed1 + dx, by + 38 + (i%4)*8 + seed2 * 0.3);
      if (t > 0.38) ctx.lineTo(38 + seed1 + dx/2, by + 52 + (i%3)*6);
      ctx.stroke();
    }
  }

  // ── Boss progress circles ──
  {
    const total = BOSSES.length;
    const startX = 62, endX = W - 62;
    const spacing = (endX - startX) / (total - 1);
    const cy = by + 42;
    const cr = 12;
    ctx.save();
    for (let i = 0; i < total; i++) {
      const b    = BOSSES[i];
      const cx2  = startX + i * spacing;
      const done    = score >= b.at;
      // Перший активний від самого початку (score >= 0)
      const current = !done && (i === 0 ? true : score >= BOSSES[i-1].at);

      // Лінія між кружечками
      if (i < total - 1) {
        const nx = startX + (i+1) * spacing;
        ctx.strokeStyle = done ? 'rgba(74,222,128,0.5)' : 'rgba(75,85,99,0.4)';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cx2 + cr, cy); ctx.lineTo(nx - cr, cy); ctx.stroke();
      }

      if (current) {
        const pulse = 0.82 + Math.sin(frame * 0.04) * 0.18;
        ctx.save(); ctx.globalAlpha = pulse;
        ctx.shadowColor = b.bg; ctx.shadowBlur = 10;
        ctx.fillStyle = b.bg;
        ctx.beginPath(); ctx.arc(cx2, cy, cr + 2, 0, Math.PI*2); ctx.fill();
        ctx.shadowBlur = 0;
        ctx.font = `${cr * 1.3}px serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(b.emoji, cx2, cy);
        ctx.restore();
      } else if (done) {
        ctx.fillStyle = '#166534';
        ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(cx2, cy, cr, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = '#4ade80';
        ctx.font = `bold ${cr * 1.1}px Arial`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('✓', cx2, cy);
      } else {
        ctx.fillStyle = 'rgba(45,55,72,0.85)';
        ctx.strokeStyle = 'rgba(100,116,139,0.5)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(cx2, cy, cr, 0, Math.PI*2); ctx.fill(); ctx.stroke();
        ctx.globalAlpha = 0.5;
        ctx.font = `${cr * 1.05}px serif`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(b.emoji, cx2, cy);
        ctx.globalAlpha = 1;
      }

      // Підпис — темна підкладка + чіткий текст
      const label = b.name;
      ctx.save();
      ctx.font = 'bold 8.5px Arial';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'top';
      const lx = cx2, ly = cy + cr + 3;
      const lw = ctx.measureText(label).width;
      // Підкладка
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      ctx.fillRect(lx - lw/2 - 2, ly - 1, lw + 4, 11);
      // Текст
      ctx.fillStyle = done ? '#4ade80' : current ? '#ffffff' : '#9ca3af';
      ctx.fillText(label, lx, ly);
      ctx.restore();
    }
    ctx.textBaseline = 'alphabetic'; ctx.textAlign = 'left';
    ctx.restore();
  }
}

function drawParticles() {
  for (const p of particles) {
    const a = p.life / p.maxLife;
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * Math.sqrt(a), 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}

function drawUI() {

  for (let i = 0; i < 3; i++) drawSnout(25 + i*30, 42, i < lives);

  // Score panel

  ctx.fillStyle = '#94a3b8'; ctx.font = '11px Arial';
  ctx.fillText(`залишилось: $${Math.max(0, 100 - score)}M`, W - 15, 46);
  ctx.textAlign = 'left';

  // Progress bar
  const pbx = W/2 - 115, pby = 11, pbw = 230, pbh = 18, pbr = 9;
  ctx.fillStyle = 'rgba(0,0,0,0.52)'; rr(pbx, pby, pbw, pbh, pbr); ctx.fill();
  const prog = Math.min(score / 100, 1);
  if (prog > 0) {
    const bClr = prog > 0.8 ? '#f87171' : prog > 0.5 ? '#fb923c' : prog > 0.25 ? '#facc15' : '#4ade80';
    ctx.fillStyle = bClr;
    ctx.save(); ctx.beginPath();
    ctx.moveTo(pbx + pbr, pby);
    ctx.lineTo(pbx + pbw*prog - (prog < 1 ? 0 : pbr), pby);
    if (prog < 1) ctx.lineTo(pbx + pbw*prog, pby + pbh/2);
    if (prog < 1) ctx.lineTo(pbx + pbw*prog - 0, pby + pbh);
    else          ctx.arcTo(pbx+pbw, pby, pbx+pbw, pby+pbh, pbr);
    if (prog >= 1) ctx.arcTo(pbx+pbw, pby+pbh, pbx, pby+pbh, pbr);
    else ctx.lineTo(pbx + pbw*prog - 0, pby + pbh);
    ctx.arcTo(pbx, pby+pbh, pbx, pby, pbr);
    ctx.arcTo(pbx, pby, pbx+pbr, pby, pbr);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
  rr(pbx, pby, pbw, pbh, pbr); ctx.stroke();
  ctx.fillStyle = 'white'; ctx.font = 'bold 10px Arial'; ctx.textAlign = 'center';
  ctx.fillText(`$${score}M / $100M`, W/2, pby + 13);
  ctx.textAlign = 'left';

  // Malfunction warning
  if (pig.malfunction) {
    ctx.save();
    ctx.globalAlpha = 0.55 + Math.sin(frame * 0.28) * 0.35;
    ctx.fillStyle = ['#fb923c','#f97316','#ef4444','#dc2626','#991b1b'][Math.min(pig.malfLevel-1, 4)];
    ctx.font = 'bold 15px Arial'; ctx.textAlign = 'center';
    const stars = '⚡'.repeat(Math.min(pig.malfLevel, 5));
    ctx.fillText(`⚠️  КРИЛО БАРАХЛИТЬ ${stars}  ⚠️`, W/2, 82);
    ctx.restore(); ctx.textAlign = 'left';
  }
}

function drawBossPopup(b) {

  // Slide-in from below
  const entranceProgress = Math.min(1, (600 - bossTimer) / 28);
  const exitProgress     = bossTimer < 40 ? bossTimer / 40 : 1;
  const alpha            = Math.min(entranceProgress, exitProgress);
  const slideY           = (1 - Math.min(entranceProgress, 1)) * 90;

  const bw = 310, bh = 96;
  const bx = W/2 - bw/2;
  const by = H - RADA_H - bh - 12 + slideY;

  ctx.save(); ctx.globalAlpha = alpha;

  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  rr(bx+4, by+4, bw, bh, 13); ctx.fill();

  ctx.fillStyle = b.bg;
  rr(bx, by, bw, bh, 13); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 2;
  rr(bx, by, bw, bh, 13); ctx.stroke();
  // Top accent
  ctx.fillStyle = 'rgba(255,255,255,0.12)';
  rr(bx, by, bw, 10, 13); ctx.fill();

  // Emoji
  ctx.font = '46px serif'; ctx.textBaseline = 'middle';
  ctx.fillText(b.emoji, bx + 17, by + bh/2);

  // Text
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'white'; ctx.font = 'bold 20px Arial';
  ctx.fillText(b.name, bx + 74, by + 37);
  ctx.fillStyle = 'rgba(255,255,255,0.75)'; ctx.font = '13px Arial';

  ctx.fillStyle = '#fde047'; ctx.font = 'bold 12px Arial';

  ctx.restore();
}

// ═══════════════════════════════════════════════════════════════
//  SOUND ENGINE  (Web Audio API — без файлів)
// ═══════════════════════════════════════════════════════════════
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function playTone(freq, type, duration, vol, decay) {
  try {
    const ac  = getAudio();
    const osc = ac.createOscillator();
    const gain= ac.createGain();
    osc.connect(gain); gain.connect(ac.destination);
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, ac.currentTime);
    gain.gain.setValueAtTime(vol || 0.18, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + (duration || 0.2));
    osc.start(ac.currentTime);
    osc.stop(ac.currentTime + (duration || 0.2));
  } catch(e) {}
}

function playNoise(duration, vol, hipass) {
  try {
    const ac  = getAudio();
    const buf = ac.createBuffer(1, ac.sampleRate * duration, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
    const src  = ac.createBufferSource();
    src.buffer = buf;
    const filt = ac.createBiquadFilter();
    filt.type = 'highpass'; filt.frequency.value = hipass || 800;
    const gain = ac.createGain();
    gain.gain.setValueAtTime(vol || 0.12, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + duration);
    src.connect(filt); filt.connect(gain); gain.connect(ac.destination);
    src.start(); src.stop(ac.currentTime + duration);
  } catch(e) {}
}

// Публічні звукові події
const SFX = {
  jump()      { playTone(320, 'sine',   0.13, 0.14); playTone(520, 'sine', 0.08, 0.07); },
  jump2()     { playTone(440, 'sine',   0.15, 0.16); playTone(660, 'sine', 0.10, 0.08); },
  land()      { playTone(120, 'triangle', 0.07, 0.10); },
  drone()     {
    // Клацання + металевий брязкіт
    playNoise(0.07, 0.18, 1200);
    playTone(180, 'sawtooth', 0.12, 0.13);
    playTone(90,  'square',   0.09, 0.11);
  },
  lightning() {
    // Гучний тріск
    playNoise(0.18, 0.28, 400);
    playTone(60, 'sawtooth', 0.22, 0.20);
  },
  malfunction() {
    // Тріск + знижена нота
    playNoise(0.12, 0.15, 600);
    playTone(110, 'sawtooth', 0.25, 0.18);
    setTimeout(() => playTone(80, 'sawtooth', 0.20, 0.12), 100);
  },
  teleport() {
    // Вух! Вихор всмоктує
    try {
      const ac = getAudio();
      const osc = ac.createOscillator();
      const gain= ac.createGain();
      osc.connect(gain); gain.connect(ac.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, ac.currentTime);
      osc.frequency.exponentialRampToValueAtTime(80, ac.currentTime + 0.35);
      gain.gain.setValueAtTime(0.22, ac.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + 0.35);
      osc.start(); osc.stop(ac.currentTime + 0.35);
    } catch(e) {}
  },
  vortex() {
    playNoise(0.2, 0.12, 300);
    playTone(200, 'sine', 0.2, 0.10);
  },
  hitLife() {
    playTone(200, 'sawtooth', 0.3, 0.22);
    setTimeout(() => playTone(140, 'sawtooth', 0.25, 0.18), 120);
    setTimeout(() => playTone(100, 'sawtooth', 0.20, 0.15), 260);
  },
  boss() {
    // Урочистий звук виходу депутата
    playTone(440, 'square', 0.1, 0.12);
    setTimeout(() => playTone(550, 'square', 0.1, 0.12), 100);
    setTimeout(() => playTone(660, 'square', 0.15, 0.14), 200);
  },
  victory() {
    [523, 659, 784, 1047].forEach((f, i) =>
      setTimeout(() => playTone(f, 'sine', 0.35, 0.18), i * 140));
  },
  bgHum() {
    // Фоновий гул мотора дрона — тихо
    try {
      const ac = getAudio();
      if (ac._bgOsc) return;
      const osc  = ac.createOscillator();
      const gain = ac.createGain();
      osc.connect(gain); gain.connect(ac.destination);
      osc.type = 'sawtooth'; osc.frequency.value = 55;
      gain.gain.value = 0.018;
      osc.start();
      ac._bgOsc = osc;
    } catch(e) {}
  },
};

// ═══════════════════════════════════════════════════════════════
//  MAIN LOOP (SFX вбудовані прямо в оригінальні функції вище)
// ═══════════════════════════════════════════════════════════════
function render() {
  ctx.clearRect(0, 0, W, H);

  drawSky();
  for (const c of clouds) drawCloud(c);
  for (const sc of stormClouds) drawCloud(sc);
  for (const v of vortices) drawVortex(v);
  for (const bh of blackHoles) drawBlackHole(bh);
  for (const pr of propellers) drawPropeller(pr);
  drawParticles();
  for (const d of drones) drawDrone(d);

  if (gState !== 'menu') {
    drawPig(pig);
    drawRada(radaCrack);
    drawUI();
    drawScorePopups();
    if (bossQueue) drawBossPopup(bossQueue);
  } else {
    drawRada(0);
  }

  if (gState === 'menu')     drawMenu();
  if (gState === 'gameover') drawGameOver();
  if (gState === 'victory')  drawVictory();
}

function loop() {
  frame++;
  update();
  render();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
</html>
